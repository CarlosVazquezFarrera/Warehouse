<main>
  <section>
    <mat-form-field class="w-100">
      <mat-label>Select a date</mat-label>
      <input matInput [matDatepicker]="dp" [formControl]="date" [max]="today">
      <mat-datepicker-toggle matIconSuffix [for]="dp"></mat-datepicker-toggle>
      <mat-datepicker #dp touchUi startView="year" (monthSelected)="setMonthAndYear($event, dp)"
        panelClass="example-month-picker">
      </mat-datepicker>
      <mat-date-range-picker touchUi #picker />
    </mat-form-field>
  </section>

  @if (store.totalEgressHaveDate()) {

  <div class="mat-elevation-z8">
    <div class="table-header-buttons">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="exportToExcel()">
          <mat-icon>file_download</mat-icon>
          <span>Download</span>
        </button>
      </mat-menu>
    </div>
    <div class="content">
      <table class="primary" mat-table [dataSource]="store.ledgerEgressMovement.data()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Product Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
        <ng-container matColumnDef="supplierPart">
          <th mat-header-cell *matHeaderCellDef>supplierPart</th>
          <td mat-cell *matCellDef="let element"> {{element.supplierPart}} </td>
        </ng-container>
        <ng-container matColumnDef="totalMovements">
          <th mat-header-cell *matHeaderCellDef> Total Egress Transactions </th>
          <td mat-cell *matCellDef="let element"> {{element.totalMovements}} </td>
        </ng-container>
        <ng-container matColumnDef="unitsRemoved">
          <th mat-header-cell *matHeaderCellDef> Total Units Removed</th>
          <td mat-cell *matCellDef="let element"> {{element.unitsRemoved |number: '1.0-0'}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator [length]="store.ledgerEgressMovement.totalCount()" [pageSize]="store.ledgerEgressMovementPageSize()"
      (page)="handlePageEvent($event)" showFirstLastButtons aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
  }
  @else{
  <app-no-data />
  }

</main>
